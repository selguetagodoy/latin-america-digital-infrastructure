<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Renewable generation and electricity carbon intensity in eight Latin American markets</title><desc id="desc">Renewable generation ranges from 100 percent in Costa Rica to 23.09 percent in Mexico. Carbon intensity values are shown when available.</desc><rect width="1200" height="760" fill="#fbfaf6"/><text x="70" y="70" font-family="Arial" font-size="18" font-weight="700" letter-spacing="2" fill="#c94b28">ENERGY PROFILE · 2025</text><text x="70" y="122" font-family="Arial" font-size="42" font-weight="700" fill="#111">Renewables and carbon intensity</text><text x="70" y="155" font-family="Arial" font-size="18" fill="#67645d">Bar: renewable generation share · Right column: gCO₂e/kWh</text><g font-family="Arial" font-size="19" fill="#111"><text x="70" y="220">Costa Rica</text><text x="70" y="285">Brazil</text><text x="70" y="350">Colombia</text><text x="70" y="415">Panama</text><text x="70" y="480">Chile</text><text x="70" y="545">Peru</text><text x="70" y="610">Argentina</text><text x="70" y="675">Mexico</text></g><g fill="#e9e5dc"><rect x="230" y="195" width="720" height="30"/><rect x="230" y="260" width="720" height="30"/><rect x="230" y="325" width="720" height="30"/><rect x="230" y="390" width="720" height="30"/><rect x="230" y="455" width="720" height="30"/><rect x="230" y="520" width="720" height="30"/><rect x="230" y="585" width="720" height="30"/><rect x="230" y="650" width="720" height="30"/></g><g fill="#161616"><rect x="230" y="195" width="720" height="30"/><rect x="230" y="260" width="626" height="30"/><rect x="230" y="325" width="554" height="30"/><rect x="230" y="390" width="490" height="30"/><rect x="230" y="520" width="461" height="30"/><rect x="230" y="585" width="249" height="30"/><rect x="230" y="650" width="166" height="30"/></g><rect x="230" y="455" width="475" height="30" fill="#c94b28"/><g font-family="Arial" font-size="16" font-weight="700" fill="#111"><text x="970" y="217">100% · N/D</text><text x="970" y="282">87% · 110</text><text x="970" y="347">77% · 187</text><text x="970" y="412">68% · 221</text><text x="970" y="477" fill="#c94b28">66% · 289</text><text x="970" y="542">64% · 238</text><text x="970" y="607">34.6% · 346</text><text x="970" y="672">23.1% · 474</text></g><text x="70" y="730" font-family="Arial" font-size="14" fill="#67645d">Energy competitiveness also depends on grid location, connection capacity, reliability and contract structure.</text></svg>