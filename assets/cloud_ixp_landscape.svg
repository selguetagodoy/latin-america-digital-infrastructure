<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cloud regions and Internet exchange points across eight Latin American markets</title><desc id="desc">Brazil has 51 IXPs and 6 active cloud regions; Chile 8 and 4; Mexico 7 and 5; Colombia 7 and 1; Peru 12 and zero; Argentina 4 and zero; Panama 2 and zero; Costa Rica 1 and zero.</desc><rect width="1200" height="680" fill="#fbfaf6"/><text x="70" y="70" font-family="Arial" font-size="18" font-weight="700" letter-spacing="2" fill="#c94b28">CLOUD + INTERCONNECTION · 2026</text><text x="70" y="122" font-family="Arial" font-size="42" font-weight="700" fill="#111">Digital ecosystem depth</text><text x="70" y="155" font-family="Arial" font-size="18" fill="#67645d">Horizontal: active IXPs · Vertical: active full cloud regions</text><g stroke="#e3dfd6" stroke-width="1"><line x1="150" y1="540" x2="1100" y2="540"/><line x1="150" y1="465" x2="1100" y2="465"/><line x1="150" y1="390" x2="1100" y2="390"/><line x1="150" y1="315" x2="1100" y2="315"/><line x1="150" y1="240" x2="1100" y2="240"/><line x1="150" y1="165" x2="1100" y2="165"/></g><line x1="150" y1="165" x2="150" y2="540" stroke="#9f9b92"/><line x1="150" y1="540" x2="1100" y2="540" stroke="#9f9b92"/><g font-family="Arial" font-size="14" fill="#67645d"><text x="125" y="545">0</text><text x="125" y="470">1</text><text x="125" y="395">2</text><text x="125" y="320">3</text><text x="125" y="245">4</text><text x="125" y="170">5+</text><text x="145" y="570">0</text><text x="320" y="570">10</text><text x="500" y="570">20</text><text x="680" y="570">30</text><text x="860" y="570">40</text><text x="1040" y="570">50</text></g><g font-family="Arial" font-size="15" font-weight="700"><circle cx="1090" cy="165" r="10" fill="#161616"/><text x="1010" y="145" fill="#111">BRA 51 / 6</text><circle cx="279" cy="203" r="9" fill="#161616"/><text x="292" y="198" fill="#111">MEX 7 / 5</text><circle cx="297" cy="240" r="10" fill="#c94b28"/><text x="311" y="235" fill="#c94b28">CHL 8 / 4</text><circle cx="279" cy="465" r="8" fill="#161616"/><text x="292" y="460" fill="#111">COL 7 / 1</text><circle cx="371" cy="540" r="7" fill="#161616"/><text x="383" y="533" fill="#111">PER 12 / 0</text><circle cx="224" cy="540" r="7" fill="#161616"/><text x="235" y="523" fill="#111">ARG 4 / 0</text><circle cx="187" cy="540" r="6" fill="#161616"/><text x="170" y="610" fill="#111">PAN 2</text><circle cx="169" cy="540" r="6" fill="#161616"/><text x="151" y="632" fill="#111">CRI 1</text></g><text x="70" y="645" font-family="Arial" font-size="14" fill="#67645d">Cloud regions are provider-defined full regions; edge/local zones are not counted as equivalent.</text></svg>