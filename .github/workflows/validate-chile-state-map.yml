name: Validate Chile State Institutional Map

on:
  push:
    paths:
      - "public-affairs/chile-state-institutional-map/**"
      - ".github/workflows/validate-chile-state-map.yml"
  pull_request:
    paths:
      - "public-affairs/chile-state-institutional-map/**"
      - ".github/workflows/validate-chile-state-map.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate institutional datasets
        run: python public-affairs/chile-state-institutional-map/scripts/validate.py
